services:
  fastapi:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - registry-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Docker socket access
      - ./server/data:/app/data
    environment:
      - DATASETS_PATH=${PWD}/server/data/datasets
      - RESULTS_PATH=${PWD}/server/data/results
      - CACHE_PATH=${PWD}/server/data/cache
      - STATIC_PATH=/app/data/results
      - MONGODB_URL=mongodb://mongodb:27017/phylogenetic_jobs
    depends_on:
      - registry
      - mongodb

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - registry-net
    depends_on:
      - fastapi
    environment:
      - BACKEND_URL=http://fastapi:8000

  registry:
    image: registry:2.8.3
    networks:
      - registry-net
    ports:
      - "5000:5000"
    volumes:
      - ./registry-data:/var/lib/registry
    environment:
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    networks:
      - registry-net
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=phylogenetic_jobs

volumes:
  mongodb_data:
networks:
  registry-net:
    driver: bridge
